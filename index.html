  --royal-dark:#142A63;
  --royal-light:#3B5FC4;

*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}

.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--neon);flex-shrink:0;}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;}

nav{background:var(--royal-dark);display:flex;overflow-x:auto;position:sticky;top:53px;z-index:19;}
nav button{flex:1;min-width:88px;background:none;border:none;color:#C6D4F5;padding:12px 8px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}

main{flex:1;padding:18px;max-width:980px;width:100%;margin:0 auto;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
.card h2{font-size:15px;margin:0 0 14px;color:var(--royal);font-weight:700;}
.card h3{font-size:13px;margin:18px 0 8px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.grid{display:grid;gap:12px;}
.grid.cols2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.grid.cols4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}

.metric{background:var(--blue-tint);border-radius:var(--radius);padding:14px 16px;border-left:4px solid var(--royal);}
.metric.pos{background:var(--green-tint);border-left-color:var(--green);}
.metric.neg{background:var(--danger-tint);border-left-color:var(--danger);}
.metric .label{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.metric .value{font-size:22px;font-weight:700;margin-top:4px;color:var(--royal);}
.metric.pos .value{color:var(--green);}
.metric.neg .value{color:var(--danger);}

label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:10px 0 4px;}
.req{color:var(--danger);font-weight:700;}

.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
button.btn{background:var(--royal);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px;}
button.btn:hover{background:var(--royal-light);}
button.btn.green{background:var(--green);}
button.btn.green:hover{background:#128a3e;}
button.btn.ghost{background:none;color:var(--royal);border:1px solid var(--royal);}
button.btn.small{padding:6px 12px;font-size:12px;margin-top:0;}
.inline-add{display:flex;gap:8px;align-items:flex-end;margin-top:8px;}
.inline-add input{flex:1;}
.inline-add button{margin-top:0;white-space:nowrap;}
.link-btn{background:none;border:none;color:var(--royal-light);font-size:12px;font-weight:600;cursor:pointer;padding:0;margin-top:6px;transition:opacity .15s;}
.link-btn:hover{opacity:.7;text-decoration:underline;}
#logo-box img{cursor:pointer;transition:opacity .15s;}
#logo-box img:hover{opacity:.8;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;padding:8px 6px;border-bottom:2px solid var(--border);white-space:nowrap;}

.badge.status-pago{background:var(--green-tint);color:var(--green);}

.del-link{display:inline-flex;align-items:center;gap:4px;color:var(--danger);background:#FEE2E2;cursor:pointer;font-size:12px;font-weight:600;border:none;padding:5px 9px;border-radius:7px;margin:2px 4px 2px 0;white-space:nowrap;}
.act-link{display:inline-flex;align-items:center;gap:4px;color:var(--royal);background:var(--blue-tint);cursor:pointer;font-size:12px;font-weight:600;border:none;padding:5px 9px;border-radius:7px;margin:2px 4px 2px 0;white-space:nowrap;}

.meta-block .meta-pct{font-weight:700;}
.meta-bar-track{width:100%;height:20px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;}
.meta-bar-fill{height:100%;background:var(--neon);border-radius:999px;transition:width .4s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;box-sizing:border-box;min-width:28px;}
.meta-bar-fill.completa{background:var(--green);}
.meta-bar-fill .meta-bar-txt{font-size:11px;font-weight:700;color:var(--royal-dark);white-space:nowrap;}
.meta-bar-fill.completa .meta-bar-txt{color:#fff;}
.meta-sem-config{background:rgba(255,255,255,.14);border-radius:var(--radius);padding:12px 14px;font-size:13px;}
.meta-sem-config a, .meta-sem-config button.link-btn{color:#fff;text-decoration:underline;}
.stock-box.agua{background:var(--green-tint);}
.stock-box.dfonte{background:var(--purple-tint);}

.badge.dfonte{background:var(--purple-tint);color:var(--purple);}
.chart-box{position:relative;height:250px;}
.chart-card h3{margin-top:0;}

.csv-preview{overflow-x:auto;margin-top:10px;}
.mapping-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mapping-row span{width:120px;font-size:13px;font-weight:600;flex-shrink:0;}
.pill{display:inline-block;background:var(--blue-tint);color:var(--royal);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;margin-left:6px;}
.searchbar{margin-bottom:12px;}
.hint{font-size:12px;color:var(--text3);margin-top:4px;}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}

.comunicado-banner{background:linear-gradient(135deg,var(--royal) 0%,var(--royal-dark) 100%);color:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden;}
.comunicado-banner img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:10px;}
.comunicado-banner h3{margin:0 0 4px;font-size:15px;color:#fff;}
.comunicado-banner p{margin:0;font-size:13px;color:#E4EAFB;white-space:pre-wrap;}

.cap-bar-wrap{margin:14px 0;}

.subtabs button.active{background:var(--royal);color:#fff;}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--royal) 0%,var(--royal-dark) 100%);padding:20px;}
.auth-card{background:#fff;border-radius:16px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);}

.auth-card .sub{font-size:13px;color:var(--text2);margin-bottom:20px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--bg);border-radius:10px;padding:4px;}
.auth-tabs button{flex:1;background:none;border:none;padding:8px;border-radius:8px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;}

.auth-form{display:none;}
.auth-form.active{display:block;}
</style>
</head>
<body>
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div style="display:flex;align-items:center;margin-bottom:2px;"><span class="dot"></span><h1>Sistema Tom Gás</h1></div>

      <button type="submit" class="btn" style="width:100%;">Entrar</button>
    </form>

    <form id="form-cadastro" class="auth-form">
      <label>Nome <span class="req">*</span></label><input type="text" name="nome" required>

      <button type="submit" class="btn" style="width:100%;">Criar conta</button>

  </div>
</div>

function fmtMoney(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(d){ const p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function monthKey(d){ return d.slice(0,7); }
function firstOfMonth(){ return todayStr().slice(0,7)+'-01'; }
function diasNoMes(mk){
  const partes = mk.split('-');
  const y = Number(partes[0]), m = Number(partes[1]);
  return new Date(y, m, 0).getDate();
}
function nomeMes(mk){
  const partes = mk.split('-');
  const y = Number(partes[0]), m = Number(partes[1]);
  return new Date(y, m-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
}
function metaMensalP13(mk){ return Number(state.metas[mk])||0; }
function metaDiariaP13(mk){ const m = metaMensalP13(mk); return m>0 ? m/diasNoMes(mk) : 0; }

}

    '</div>';
  const catSel = div.querySelector('.iv-categoria');
  const wrapLivre = div.querySelector('.iv-produto-livre-wrap');

  const manualWrap = div.querySelector('#'+manualId);
  const valorUnitInput = div.querySelector('.iv-valor-unit');
  const produtoSelectHandler = ()=>{
    if(produtoSelect.value==='__outro__'){
      manualWrap.style.display = 'block';
      produtoLivreInput.value = ''; produtoLivreInput.focus();
    } else {
      manualWrap.style.display = 'none';
      produtoLivreInput.value = produtoSelect.value;
      const opt = produtoSelect.selectedOptions[0];
      if(opt && opt.dataset.preco) valorUnitInput.value = Number(opt.dataset.preco).toFixed(2);
    }
  };
  produtoSelect.onchange = produtoSelectHandler;
  catSel.onchange = ()=>{
    wrapLivre.style.display = 'block';

}

    produtos.map(p=>'<option value="'+p.nome+'" data-preco="'+p.preco+'">'+p.nome+' — '+fmtMoney(p.preco)+'</option>').join('')+

function calcularTotalCarrinho(){
  const fvEl = document.getElementById('form-venda');
  let total = 0;
  if(fvEl && fvEl.quantidade && fvEl.valor_unit){
    total += (Number(fvEl.quantidade.value)||0) * (Number(fvEl.valor_unit.value)||0);
  }
  document.querySelectorAll('.iv-extra-row').forEach(row=>{
    const q = Number(row.querySelector('.iv-quantidade').value)||0;
    const v = Number(row.querySelector('.iv-valor-unit').value)||0;
    total += q*v;
  });
  const freteEl = document.getElementById('input-frete');
  const frete = freteEl ? (Number(freteEl.value)||0) : 0;
  return {total, frete};
}
function atualizarTotalCarrinho(){
  const totalEl = document.getElementById('carrinho-total');
  if(!totalEl) return;
  const {total, frete} = calcularTotalCarrinho();
  totalEl.textContent = frete>0 ?
    'Produtos: '+fmtMoney(total)+'  +  Frete: '+fmtMoney(frete)+'  =  Total: '+fmtMoney(total+frete) :
    'Total do carrinho: '+fmtMoney(total);
  atualizarBoxCreditoVenda();
}
function atualizarBoxCreditoVenda(){
  const box = document.getElementById('credito-cliente-box');
  const fvEl = document.getElementById('form-venda');
  if(!box || !fvEl) return;
  const nomeCliente = fvEl.cliente ? fvEl.cliente.value.trim() : '';
  const saldo = nomeCliente ? saldoCreditoCliente(nomeCliente) : 0;
  if(!nomeCliente || saldo<=0.004){
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  const {total, frete} = calcularTotalCarrinho();
  const totalVenda = Math.round((total+frete)*100)/100;
  const chkAntigo = document.getElementById('chk-usar-credito');
  const usar = chkAntigo ? chkAntigo.checked : false;
  const abatido = usar ? Math.round(Math.min(saldo, totalVenda)*100)/100 : 0;
  const diferenca = Math.round((totalVenda - abatido)*100)/100;
  const opcoesDiferenca = ['Marcou/Fiado'].concat(PAGAMENTOS.filter(p=>p!=='Abateu' && p!=='Marcou/Fiado'));
  box.style.display = 'block';
  box.innerHTML = '<div class="item-venda-row" style="background:var(--purple-tint);border-color:var(--purple);">'+
    '<div><strong>💰 '+nomeCliente+' tem '+fmtMoney(saldo)+' de crédito em haver.</strong></div>'+
    '<label class="checkbox-item" style="margin-top:6px;"><input type="checkbox" id="chk-usar-credito" '+(usar?'checked':'')+'> Usar crédito nesta venda</label>'+
    (usar ? (
      '<div class="hint" style="margin-top:6px;">Total da venda: '+fmtMoney(totalVenda)+' — abatido do crédito: <strong>'+fmtMoney(abatido)+'</strong>'+
      (diferenca>0.004 ? '. Ainda falta pagar <strong>'+fmtMoney(diferenca)+'</strong>.' : '. Cobre o valor total — nada mais a pagar.') +'</div>'+
      (diferenca>0.004 ? (
        '<div style="margin-top:8px;"><label>Como a diferença de '+fmtMoney(diferenca)+' vai ser paga?</label>'+
        '<select id="sel-forma-diferenca-credito">'+
        opcoesDiferenca.map(p=>'<option value="'+p+'">'+(p==='Marcou/Fiado'?'Fica de fiado (a receber)':p)+'</option>').join('')+
        '</select></div>'
      ) : '')
    ) : '')+
    '</div>';
  const novoChk = document.getElementById('chk-usar-credito');
  if(novoChk) novoChk.onchange = atualizarBoxCreditoVenda;
}

const APP_DATA_KEYS = ['vendas','despesas','clientes','empresas','produtos','estoque','estoqueLancamentos','categoriasProdutos','categoriasDespesas','fiados','fiadoPagamentos','creditos','agendamentos','metas','comunicados','precosControlados','historicoMensal','logoUrl','faviconUrl'];
async function loadAll(){
  try{
    const { data, error } = await supabaseClient.from('app_data').select('chave,valor').in('chave', APP_DATA_KEYS);
    if(error) throw error;
    (data||[]).forEach(row=>{ state[row.chave] = row.valor; });
  }catch(e){ console.error('Erro ao carregar dados', e); alert('Não foi possível carregar os dados do Supabase. Verifique a tabela app_data e as permissões.'); }
  if(!state.estoque || !state.estoque.gas || !state.estoque.agua){ state.estoque = defaultEstoque(); }
  if(!state.agendamentos) state.agendamentos = [];
  if(!state.empresas) state.empresas = [];
  if(!state.fiadoPagamentos) state.fiadoPagamentos = [];
  if(!state.produtos) state.produtos = [];
  if(!state.precosControlados) state.precosControlados = {};
  if(!state.historicoMensal) state.historicoMensal = [];
  if(!state.estoqueLancamentos) state.estoqueLancamentos = [];
  if(!state.creditos) state.creditos = [];
  if(!state.comunicados) state.comunicados = [];
  if(!state.metas) state.metas = {};
  if(state.categoriasProdutos){
    const RENOMEACOES_CATEGORIAS = {
      'Mercearia':'Produtos de Mercearia',
      'Produtos de limpeza':'Produtos de Limpeza',
      'Bandeja de ovos':'Bandeja de Ovos',
      'Acessórios de gás':'Acessórios para Gás',
      'Acessórios de água':'Acessórios para Água'
    };
    let categoriasMudaram = false;
    Object.keys(RENOMEACOES_CATEGORIAS).forEach(function(nomeAntigo){
      if(state.categoriasProdutos.includes(nomeAntigo) && !state.categoriasProdutos.includes(RENOMEACOES_CATEGORIAS[nomeAntigo])){
        renomearCategoriaProduto(nomeAntigo, RENOMEACOES_CATEGORIAS[nomeAntigo]);
        categoriasMudaram = true;
      }
    });
    CATEGORIAS_PRODUTO_PADRAO.forEach(function(cat){
      if(!state.categoriasProdutos.includes(cat)){
        state.categoriasProdutos.push(cat);
        categoriasMudaram = true;
      }
    });
    if(categoriasMudaram){
      await save('categoriasProdutos'); await save('produtos'); await save('vendas'); await save('agendamentos');
    }
    const catsUnif = mesclarCategoriasDuplicadas();
    const despUnif = mesclarCategoriasDespesasDuplicadas();
    const prodUnif = mesclarProdutosDuplicados();
    if(catsUnif>0 || despUnif>0 || prodUnif>0){
      await save('categoriasProdutos'); await save('categoriasDespesas'); await save('produtos'); await save('vendas'); await save('agendamentos'); await save('despesas');
    }
    const chaveControlada = {};
    CATEGORIAS_CONTROLADAS.forEach(function(c){ chaveControlada[chaveNormalizada(c)] = c; });
    let duplicatasEstoqueRemovidas = 0;
    categoriasNaoControladas().forEach(function(cat){
      const alvo = chaveControlada[chaveNormalizada(cat)];
      if(alvo){
        renomearCategoriaProduto(cat, alvo);
        state.categoriasProdutos = state.categoriasProdutos.filter(c=>c!==cat);
        state.produtos = state.produtos.filter(p=>!(p.categoria===alvo && !p.fixo));
        duplicatasEstoqueRemovidas++;
      }
    });
    if(duplicatasEstoqueRemovidas>0){
      await save('categoriasProdutos'); await save('produtos'); await save('vendas'); await save('agendamentos');
    }
    let produtosControladosMudaram = false;
    CATEGORIAS_CONTROLADAS.forEach(function(cat){
      const existente = state.produtos.find(p=>p.categoria===cat && p.fixo);
      if(!existente){
        const precoMigrado = (state.precosControlados && state.precosControlados[cat]!=null) ? Number(state.precosControlados[cat]) : 0;
        state.produtos.push({id:uid(), nome:cat, categoria:cat, preco:precoMigrado, fixo:true});
        produtosControladosMudaram = true;
      }
    });
    if(produtosControladosMudaram){
      await save('produtos');
    }
  }
}
async function save(key){
  try{
    const { data, error } = await supabaseClient.from('app_data')
      .upsert({ chave:key, valor: state[key], atualizado_em: new Date().toISOString() }, { onConflict: 'chave' })
      .select();
    if(error) throw error;
    if(!data || data.length===0){
      console.warn('O upsert não retornou linhas para "'+key+'" — normalmente isso indica que falta a política de UPDATE na tabela app_data (RLS).');
      alert('Os dados não foram salvos no Supabase. Confira se a tabela app_data tem a política de UPDATE para usuários autenticados, além da de INSERT.');
    }
  }catch(e){ console.error('Erro ao salvar', key, e); alert('Não foi possível salvar no Supabase: '+(e.message||e)); }
}

/* ---------- BACKUP ---------- */
function chaveBackupHoje(){ return 'backup:'+todayStr(); }
function diaAnteriorStr(dataStr){
  const d = new Date(dataStr+'T12:00:00');
  d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function montarSnapshotBackup(){
  const dados = {};
  APP_DATA_KEYS.forEach(function(k){ dados[k] = state[k]; });
  return dados;
}
function baixarJson(nomeArquivo, objeto){
  const blob = new Blob([JSON.stringify(objeto, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function existeBackup(chave){
  try{
    const { data, error } = await supabaseClient.from('app_data').select('chave').eq('chave', chave).limit(1);
    if(error) throw error;
    return !!(data && data.length>0);
  }catch(e){ console.error('Erro ao checar backup', e); return true; }
}
async function criarBackupComChave(chave, tipo){
  try{
    const valor = { tipo: tipo, criado_em: new Date().toISOString(), dados: montarSnapshotBackup() };
    const { error } = await supabaseClient.from('app_data')
      .upsert({ chave: chave, valor: valor, atualizado_em: new Date().toISOString() }, { onConflict:'chave' });
    if(error) throw error;
    limparBackupsAntigos();
    return true;
  }catch(e){ console.error('Erro ao criar backup', e); return false; }
}
async function criarBackup(tipo){
  const chave = tipo==='manual' ? chaveBackupAgora() : chaveBackupHoje();
  return criarBackupComChave(chave, tipo);
}
function chaveBackupAgora(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  return 'backup:'+todayStr()+'T'+hh+mm+ss;
}
async function limparBackupsAntigos(){
  try{
    const { data, error } = await supabaseClient.from('app_data').select('chave').like('chave','backup:%').order('chave', {ascending:false});
    if(error || !data) return;
    const excedentes = data.slice(30).map(r=>r.chave);
    if(excedentes.length>0){
      await supabaseClient.from('app_data').delete().in('chave', excedentes);
    }
  }catch(e){ console.error('Erro ao limpar backups antigos', e); }
}
async function rodarBackupAutomaticoSeNecessario(){
  // Feito na primeira abertura do dia: como ainda não foi lançado nada hoje,
  // o estado atual reflete o fechamento de ONTEM — é isso que fica registrado.
  const dataFechamento = diaAnteriorStr(todayStr());
  const chave = 'backup:'+dataFechamento;
  const ja = await existeBackup(chave);
  if(!ja) await criarBackupComChave(chave, 'automatico');
}
async function renderListaBackups(){
  const container = document.getElementById('lista-backups');
  if(!container) return;
  try{
    const { data, error } = await supabaseClient.from('app_data').select('chave,valor').like('chave','backup:%').order('chave',{ascending:false}).limit(30);
    if(error) throw error;
    if(!data || data.length===0){ container.innerHTML = '<div class="empty">Nenhum backup ainda.</div>'; return; }
    container.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Data</th><th>Hora</th><th>Tipo</th><th></th></tr></thead><tbody>'+
      data.map(function(row){
        const partes = row.chave.replace('backup:','').split('T');
        const dataStr = partes[0];
        const horaStr = partes[1] ? (partes[1].slice(0,2)+':'+partes[1].slice(2,4)+':'+partes[1].slice(4,6)) : '—';
        const tipo = row.valor && row.valor.tipo==='manual' ? 'Manual' : 'Automático';
        return '<tr><td>'+fmtDate(dataStr)+'</td><td>'+horaStr+'</td><td>'+tipo+'</td>'+
          '<td><button class="act-link" data-baixar-backup="'+row.chave+'">⬇ baixar</button>'+
          '<button class="del-link" data-restaurar-backup="'+row.chave+'">↺ restaurar</button></td></tr>';
      }).join('')+'</tbody></table></div>';
    container.querySelectorAll('[data-baixar-backup]').forEach(btn=>btn.onclick=async()=>{
      const chave = btn.dataset.baixarBackup;
      const linha = (await supabaseClient.from('app_data').select('valor').eq('chave',chave).single()).data;
      if(!linha){ alert('Não foi possível baixar esse backup.'); return; }
      baixarJson(chave.replace(':','-')+'.json', linha.valor);
    });
    container.querySelectorAll('[data-restaurar-backup]').forEach(btn=>btn.onclick=async()=>{
      const chave = btn.dataset.restaurarBackup;
      const dataStr = chave.replace('backup:','').split('T')[0];
      if(!confirm('Isso vai SUBSTITUIR todos os dados atuais (vendas, clientes, produtos, tudo) pelo conteúdo do backup de '+fmtDate(dataStr)+'. Essa ação não pode ser desfeita. Continuar?')) return;
      if(!confirm('Tem certeza mesmo? Se ainda não fez um backup dos dados de agora, cancele e faça um backup manual antes.')) return;
      const linha = (await supabaseClient.from('app_data').select('valor').eq('chave',chave).single()).data;
      if(!linha || !linha.valor || !linha.valor.dados){ alert('Não foi possível ler esse backup.'); return; }
      const dados = linha.valor.dados;
      const chaves = Object.keys(dados);
      chaves.forEach(function(k){ state[k] = dados[k]; });
      for(const k of chaves){ await save(k); }
      alert('Backup restaurado com sucesso!');
      await loadAll();
      renderAll();
    });
  }catch(e){ console.error('Erro ao listar backups', e); container.innerHTML = '<div class="empty">Não foi possível carregar os backups.</div>'; }
}

function attachLogoInput(){
  const fileInput = document.getElementById('logo-file-input');
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = async ()=>{
        const maxW=220, maxH=76;
        let w=img.width, h=img.height;
        const scale = Math.min(maxW/w, maxH/h, 1);
        w=Math.round(w*scale); h=Math.round(h*scale);
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        state.logoUrl = canvas.toDataURL('image/png');
        await save('logoUrl');
        renderHeaderLogo();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
}

function debitosDoCliente(cliente){
  const manuais = state.fiados.filter(f=>f.cliente===cliente).map(f=>({id:f.id, data:f.data, descricao:f.descricao||'Fiado lançado manualmente', valor:f.valor}));
  const vendas = state.vendas.filter(v=>v.cliente===cliente && v.pagamento==='Marcou/Fiado').map(v=>({
    id:v.id, data:v.data,
    descricao:v.quantidade+'x '+v.produto+(v.frete?' + frete '+fmtMoney(v.frete):''),
    valor: v.valor_total + (v.frete||0)
  }));
  return manuais.concat(vendas).sort((a,b)=>a.data.localeCompare(b.data));
}
function pagamentosDoCliente(cliente){
  return state.fiadoPagamentos.filter(p=>p.cliente===cliente).sort((a,b)=>a.data.localeCompare(b.data));
}
function saldoDoCliente(cliente){
  const debitos = debitosDoCliente(cliente).reduce((s,d)=>s+d.valor,0);
  const pagos = pagamentosDoCliente(cliente).reduce((s,p)=>s+p.valor,0);
  return Math.max(0, debitos - pagos);
}
function totalFiadoAberto(){
  return clientesComFiado().reduce((s,c)=>s+saldoDoCliente(c), 0);
}

function criarChart(id, config){
  const el = document.getElementById(id);
  if(!el) return;
  if(typeof Chart==='undefined'){

}

function ajustaEstoquePorVenda(categoria, qtd, reverter){
  const info = CATEGORIAS_ESTOQUE[categoria];
  if(!info) return;
  const sinal = reverter ? -1 : 1;
  const bucket = info.grupo==='gas' ? state.estoque.gas[info.chave] : state.estoque.agua[info.chave];
  if(!bucket) return;
  if(info.tipo==='carga'){ bucket.cheio -= qtd*sinal; bucket.vazio += qtd*sinal; }
  else { bucket.vazio -= qtd*sinal; }
}

function chaveNormalizada(str){
  return (str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
}
function mesclarCategoriasDuplicadas(){
  const vistos = {};
  const duplicatas = [];
  const novaLista = [];
  state.categoriasProdutos.forEach(function(cat){
    const chave = chaveNormalizada(cat);
    if(vistos[chave]){
      if(vistos[chave]!==cat) duplicatas.push({de:cat, para:vistos[chave]});
    } else {
      vistos[chave] = cat;
      novaLista.push(cat);
    }
  });
  duplicatas.forEach(function(d){
    state.produtos.forEach(function(p){ if(p.categoria===d.de) p.categoria = d.para; });
    state.vendas.forEach(function(v){ if(v.categoria===d.de) v.categoria = d.para; });
    state.agendamentos.forEach(function(a){ if(a.categoria===d.de) a.categoria = d.para; });
  });
  state.categoriasProdutos = novaLista;
  return duplicatas.length;
}
function mesclarCategoriasDespesasDuplicadas(){
  const vistos = {};
  const duplicatas = [];
  const novaLista = [];
  state.categoriasDespesas.forEach(function(cat){
    const chave = chaveNormalizada(cat);
    if(vistos[chave]){
      if(vistos[chave]!==cat) duplicatas.push({de:cat, para:vistos[chave]});
    } else {
      vistos[chave] = cat;
      novaLista.push(cat);
    }
  });
  duplicatas.forEach(function(d){
    state.despesas.forEach(function(x){ if(x.categoria===d.de) x.categoria = d.para; });
  });
  state.categoriasDespesas = novaLista;
  return duplicatas.length;
}
function mesclarProdutosDuplicados(){
  const vistos = {};
  const manter = [];
  let removidos = 0;
  state.produtos.forEach(function(p){
    const chave = p.categoria+'||'+chaveNormalizada(p.nome);
    if(vistos[chave]){
      removidos++;
      const existente = vistos[chave];
      if((!existente.preco || existente.preco===0) && p.preco) existente.preco = p.preco;
    } else {
      vistos[chave] = p;
      manter.push(p);
    }
  });
  state.produtos = manter;
  return removidos;
}
function categoriasSuspeitasDuplicarEstoque(){
  return categoriasNaoControladas().filter(function(cat){

/* ---------- ESTOQUE ---------- */
const TAMANHOS_GAS = {P5:16, P13:22, P20:28, P45:34};
function pesoGasTotal(){
  const g = state.estoque.gas;
  let cheio=0, vazio=0;
  const porTipoCheio={}, porTipoVazio={};
  ['P5','P13','P20','P45'].forEach(t=>{
    const pc = (g[t].cheio||0)*PESO_GAS_KG[t];
    const pv = (g[t].vazio||0)*PESO_GAS_KG[t];
    cheio += pc; vazio += pv;
    porTipoCheio[t]=pc; porTipoVazio[t]=pv;
  });
  return {cheio, vazio, porTipoCheio, porTipoVazio};
}
const CAPACIDADE_GAS_KG = 1560;
function viewCapacidadeGas(){
  const cap = CAPACIDADE_GAS_KG;
  const p = pesoGasTotal();
  const ocupado = p.cheio + p.vazio;
  const pctCheio = Math.min(100, (p.cheio/cap)*100);
  const pctVazio = Math.min(100-pctCheio, (p.vazio/cap)*100);
  const pctOcupado = Math.min(100, (ocupado/cap)*100);
  const excedente = Math.max(0, ocupado-cap);
  const coresTipo = {P5:'#B45309', P13:'#1E3A8A', P20:'#0EA5E9', P45:'#7C3AED'};
  function segmentosHtml(porTipo, totalLado){
    if(totalLado<=0) return '';
    return ['P5','P13','P20','P45'].map(t=>{
      const w = porTipo[t];
      if(w<=0) return '';
      const pct = (w/totalLado)*100;
      return '<div class="cap-seg" style="width:'+pct+'%;background:'+coresTipo[t]+';" title="'+t+' — '+w.toFixed(1)+' kg"></div>';
    }).join('');
  }
  const legendaTipos = ['P5','P13','P20','P45'].map(t=>
    '<span><span class="dot" style="background:'+coresTipo[t]+';"></span>'+t+' — equivale a '+(PESO_GAS_KG[t]/13).toFixed(2)+' espaço(s) de P13</span>').join('');
  return '<div class="card"><h2>Capacidade de estoque de gás (Categoria 2) <span class="pill">'+cap.toLocaleString('pt-BR')+' kg</span></h2>'+
    '<div class="hint">O depósito começa com 0 kg ocupados e vai até o limite de <strong>'+cap.toLocaleString('pt-BR')+' kg</strong>. Cada casco ocupa espaço pelo peso do vasilhame — cheio ou vazio conta igual (P5=5kg, P13=13kg, P20=20kg, P45=45kg). Os cheios preenchem a barra a partir da esquerda, os vazios a partir da direita — o espaço em branco no meio é a capacidade ainda livre.</div>'+
    '<div class="cap-bar-wrap"><div class="cap-bar">'+
    '<div class="cap-lado cheio" style="width:'+pctCheio+'%;">'+segmentosHtml(p.porTipoCheio, p.cheio)+'</div>'+
    '<div class="cap-lado vazio" style="width:'+pctVazio+'%;">'+segmentosHtml(p.porTipoVazio, p.vazio)+'</div>'+
    '</div>'+
    '<div class="cap-legend">'+legendaTipos+'</div>'+
    '</div>'+
    (excedente>0 ? '<div class="hint" style="color:var(--danger);font-weight:600;margin-top:4px;">Atenção: o estoque está '+excedente.toFixed(1)+' kg acima do limite de '+cap+' kg da categoria.</div>' : '')+
    '<div class="grid cols4" style="margin-top:14px;">'+

function getClienteEndereco(nome){
  if(!nome) return '—';
  const c = state.clientes.find(x=>x.nome.toLowerCase()===nome.toLowerCase());
  if(!c) return '—';
  const partes = [c.endereco,c.complemento].filter(Boolean);
  return partes.length ? partes.join(', ') : '—';
}
function listaAgendamentosDoDia(data){
  const daVenda = state.vendas.filter(v=>v.entrega_hora && (v.entrega_data||v.data)===data).map(v=>({
    id:v.id, hora:v.entrega_hora, cliente:v.cliente, produto:v.categoria+(v.quantidade>1?' x'+v.quantidade:''),
    tipo_entrega:v.tipo_entrega, empresa:v.empresa, origem:'venda', status: v.entrega_status==='entregue' ? 'concluido' : 'pendente'
  }));
  const avulsos = state.agendamentos.filter(a=>a.data===data).map(a=>({
    id:a.id, hora:a.hora, cliente:a.cliente, produto:a.produto_nota, tipo_entrega:a.tipo_entrega, empresa:a.empresa,
    origem:'agendamento', status:a.status
  }));
  return daVenda.concat(avulsos).sort((a,b)=>a.hora.localeCompare(b.hora));
}
function todosAgendamentosEVendas(){
  const daVenda = state.vendas.filter(v=>v.entrega_hora).map(v=>({
    id:v.id, hora:v.entrega_hora, data:v.entrega_data||v.data, cliente:v.cliente, produto:v.categoria+(v.quantidade>1?' x'+v.quantidade:''),
    tipo_entrega:v.tipo_entrega, empresa:v.empresa, pagamento:v.pagamento, valor:v.valor_total, origem:'venda',
    status: v.entrega_status==='entregue' ? 'concluido' : 'pendente'
  }));
  const avulsos = state.agendamentos.map(a=>({
    id:a.id, hora:a.hora, data:a.data, cliente:a.cliente, produto:a.produto_nota, tipo_entrega:a.tipo_entrega, empresa:a.empresa,
    pagamento:a.pagamento, valor:a.valor, origem:'agendamento', status:a.status
  }));
  return daVenda.concat(avulsos).sort((a,b)=> (b.data+b.hora).localeCompare(a.data+a.hora));
}

      const pagtoStatus = v.pagamento==='Marcou/Fiado' ? ' <span class="badge status-receber">A receber</span>' : (v.pagamento ? ' <span class="badge status-pago">Pago</span>' : '');
      return '<tr>'+(mostrarData?'<td>'+fmtDate(v.data)+'</td>':'')+'<td>'+v.hora+'</td><td>'+(v.cliente||'—')+'</td><td>'+getClienteEndereco(v.cliente)+'</td>'+

        '<td>'+statusBadge+'</td><td>'+acao+'</td></tr>';
    }).join('')+'</tbody></table></div>';

function iniciarEditarAgendamento(id){
  const a = state.agendamentos.find(x=>x.id===id);
  const fa = document.getElementById('form-agendamento');
  if(!a || !fa) return;
  editAgendamentoId = a.id;
  fa.cliente.value=a.cliente||''; fa.data.value=a.data; fa.hora.value=a.hora;
  if(fa.categoria) fa.categoria.value = a.categoria || '';
  if(!fa.categoria.value && a.produto_nota){
    // agendamento antigo, criado antes da categoria existir: joga tudo como texto livre
    if(fa.categoria) fa.categoria.value = state.categoriasProdutos.find(c=>!isControlada(c)) || '';
  }
  if(fa.produto_livre) fa.produto_livre.value = (a.categoria && !isControlada(a.categoria)) ? (a.produto||a.produto_nota||'') : '';
  if(fa.quantidade) fa.quantidade.value = a.quantidade || 1;
  fa.tipo_entrega.value=a.tipo_entrega||''; fa.empresa.value=a.empresa||'';
  if(fa.pagamento) fa.pagamento.value=a.pagamento||PAGAMENTOS[0];
  if(fa.valor) fa.valor.value = a.valor ? Number(a.valor).toFixed(2) : '';
  if(fa.frete) fa.frete.value=a.frete||'';
  toggleDetalhesEntregaAgendamento();
  toggleProdutoAgendamento();
  const selProdCatAg = document.getElementById('sel-produto-catalogo-ag');
  const manualWrapAg = document.getElementById('wrap-produto-manual-ag');
  if(selProdCatAg && fa.categoria.value && !isControlada(fa.categoria.value)){
    const nomeProduto = fa.produto_livre.value;
    const existe = Array.from(selProdCatAg.options).some(o=>o.value===nomeProduto);
    if(existe){
      selProdCatAg.value = nomeProduto;
      if(manualWrapAg) manualWrapAg.style.display = 'none';
    } else if(nomeProduto){
      selProdCatAg.value = '__outro__';
      if(manualWrapAg) manualWrapAg.style.display = 'block';
    }
  }
  toggleAvisoRetroativoAgendamento();
  fa.querySelector('button[type=submit]').textContent='Salvar alterações';
  fa.scrollIntoView({behavior:'smooth'});
}
function iniciarFinalizarEntrega(id){
  const a = state.agendamentos.find(x=>x.id===id);
  if(!a) return;
  agendamentoParaConcluir = a.id;
  prefillVenda = { cliente:a.cliente||'', tipo_entrega:a.tipo_entrega||'', empresa:a.empresa||'', entrega_data:a.data||'', entrega_hora:a.hora||'', obs:a.produto_nota||'', pagamento:a.pagamento||'', frete:a.frete||'', categoria:a.categoria||'', produto_livre:(a.categoria && !isControlada(a.categoria))?(a.produto||''):'', quantidade:a.quantidade||'' };
  currentTab = 'vendas';
  renderAll();
}

function renderHistoricoMapping(headers, linhas){
  const wrap = document.getElementById('historico-mapping');
  if(!wrap) return;
  const colMes = headers[0];
  const registros = linhas.map(function(r){
    const mesTxt = r[colMes];
    let mesChave = normalizarDataImportada(mesTxt, '');
    if(!mesChave){
      const m = String(mesTxt).match(/(\d{4})/);
      mesChave = m ? m[1]+'-01' : '';
    }
    const dados = {};
    headers.slice(1).forEach(h=>{
      const v = r[h];
      if(v!=null && v!==''){ const n = Number(String(v).replace(',','.')); dados[h] = isNaN(n)?v:n; }
    });
    return {mes: mesChave.slice(0,7), dados: dados};
  }).filter(r=>r.mes);
  wrap.innerHTML = '<div class="hint" style="margin-top:10px;">'+registros.length+' mês(es) encontrados: '+registros.map(r=>r.mes).join(', ')+'</div>'+
    '<button class="btn small green" id="btn-importar-historico" style="margin-top:8px;">Importar '+registros.length+' mês(es)</button>';
  document.getElementById('btn-importar-historico').onclick = async ()=>{
    registros.forEach(function(reg){
      const idx = state.historicoMensal.findIndex(x=>x.mes===reg.mes);
      if(idx>-1) state.historicoMensal[idx] = reg; else state.historicoMensal.push(reg);
    });
    await save('historicoMensal');
    wrap.innerHTML = '';
    renderAll();
    alert(registros.length+' mês(es) importado(s)/atualizado(s) com sucesso!');
  };
}
function evolucaoMensalCompleta(){
  const porMes = {};
  state.historicoMensal.forEach(function(h){
    const d = h.dados;
    const chaveVendas = Object.keys(d).find(k=>/vendas/i.test(k));
    const chaveDespesas = Object.keys(d).find(k=>/despesas/i.test(k));
    const chaveP13 = Object.keys(d).find(k=>/p13/i.test(k));
    const chavePovo = Object.keys(d).find(k=>/povo/i.test(k));
    porMes[h.mes] = {
      vendas: chaveVendas ? Number(d[chaveVendas])||0 : 0,
      despesas: chaveDespesas ? Number(d[chaveDespesas])||0 : 0,
      p13: (chaveP13?Number(d[chaveP13])||0:0) + (chavePovo?Number(d[chavePovo])||0:0)
    };
  });
  const mesesReais = new Set();
  state.vendas.forEach(v=>mesesReais.add(monthKey(v.data)));
  state.despesas.forEach(d=>mesesReais.add(monthKey(d.data)));
  mesesReais.forEach(function(mk){
    porMes[mk] = {
      vendas: state.vendas.filter(v=>monthKey(v.data)===mk).reduce((s,v)=>s+v.valor_total,0),
      despesas: state.despesas.filter(d=>monthKey(d.data)===mk).reduce((s,d)=>s+d.valor,0),
      p13: p13VendidosNoMes(mk)
    };
  });
  return porMes;
}

    if(el) el.parentElement.innerHTML = '<div class="empty">Importe o histórico ou lance vendas pra ver a evolução.</div>';

function renderRelatorioItensResultado(){
  const de = document.getElementById('ri-de').value, ate = document.getElementById('ri-ate').value;
  const selecionadas = Array.from(document.querySelectorAll('.ri-cat:checked')).map(c=>c.value);
  const wrap = document.getElementById('ri-resultado');
  if(selecionadas.length===0){ wrap.innerHTML = '<div class="empty">Selecione ao menos uma categoria para contar.</div>'; return; }
  const filtradas = state.vendas.filter(v=> v.data>=de && v.data<=ate && selecionadas.includes(v.categoria));
  const totalQtd = filtradas.reduce((s,v)=>s+v.quantidade,0);
  const totalValor = filtradas.reduce((s,v)=>s+v.valor_total,0);
  const porCategoria = {};
  filtradas.forEach(v=>{
    if(!porCategoria[v.categoria]) porCategoria[v.categoria] = {qtd:0, valor:0};
    porCategoria[v.categoria].qtd += v.quantidade;
    porCategoria[v.categoria].valor += v.valor_total;
  });
  const linhas = Object.entries(porCategoria).sort((a,b)=>b[1].qtd-a[1].qtd);
  wrap.innerHTML =
    '<div class="grid cols2" style="margin-bottom:12px;">'+
    '<div class="metric"><div class="label">Itens vendidos (categorias selecionadas)</div><div class="value">'+totalQtd+'</div></div>'+
    '<div class="metric"><div class="label">Valor total</div><div class="value">'+fmtMoney(totalValor)+'</div></div>'+
    '</div>'+
    (linhas.length===0?'<div class="empty">Nenhuma venda encontrada para essas categorias no período.</div>':
    '<div class="table-wrap"><table><thead><tr><th>Categoria</th><th>Quantidade</th><th>Valor total</th></tr></thead><tbody>'+
    linhas.map(l=>'<tr><td>'+l[0]+'</td><td>'+l[1].qtd+'</td><td>'+fmtMoney(l[1].valor)+'</td></tr>').join('')+
    '</tbody></table></div>');
}
function renderRelatorioEntregasResultado(){
  const de = document.getElementById('rent-de').value, ate = document.getElementById('rent-ate').value;
  const tipo = document.getElementById('rent-tipo').value;
  const filtradas = state.vendas.filter(v=> v.data>=de && v.data<=ate && (!tipo || v.tipo_entrega===tipo));
  const porTipo = {};
  filtradas.forEach(v=>{
    if(!porTipo[v.tipo_entrega]) porTipo[v.tipo_entrega] = {qtd:0, frete:0};
    porTipo[v.tipo_entrega].qtd += 1;
    porTipo[v.tipo_entrega].frete += (v.frete||0);
  });
  const linhas = Object.entries(porTipo).sort((a,b)=>b[1].qtd-a[1].qtd);
  const freteTotal = filtradas.reduce((s,v)=>s+(v.frete||0),0);
  document.getElementById('rent-resultado').innerHTML =
    '<div class="grid cols2" style="max-width:420px;margin-bottom:12px;">'+
    '<div class="metric"><div class="label">Total de entregas no período</div><div class="value">'+filtradas.length+'</div></div>'+
    '<div class="metric"><div class="label">Total arrecadado em frete</div><div class="value">'+fmtMoney(freteTotal)+'</div></div>'+
    '</div>'+
    (linhas.length===0?'<div class="empty">Nenhuma entrega encontrada nesse período.</div>':
    '<div class="table-wrap"><table><thead><tr><th>Meio de entrega</th><th>Quantidade</th><th>Frete arrecadado</th></tr></thead><tbody>'+
    linhas.map(l=>'<tr><td>'+entregaLabel(l[0])+'</td><td>'+l[1].qtd+'</td><td>'+fmtMoney(l[1].frete)+'</td></tr>').join('')+
    '</tbody></table></div>');
}
function renderRelatorioVendasResultado(){
  const de = document.getElementById('rv-de').value, ate = document.getElementById('rv-ate').value;
  const nome = document.getElementById('rv-nome').value.toLowerCase();
  const filtradas = state.vendas.filter(v=> v.data>=de && v.data<=ate && (!nome || (v.cliente||'').toLowerCase().includes(nome)));
  const total = filtradas.reduce((s,v)=>s+v.valor_total,0);
  const porCategoria = {};
  filtradas.forEach(v=>{
    if(!porCategoria[v.categoria]) porCategoria[v.categoria] = {qtd:0, valor:0};
    porCategoria[v.categoria].qtd += v.quantidade;
    porCategoria[v.categoria].valor += v.valor_total;
  });
  const linhasCategoria = Object.entries(porCategoria).sort((a,b)=>a[0].localeCompare(b[0]));
  document.getElementById('rv-resultado').innerHTML =
    '<div class="metric" style="max-width:260px;margin-bottom:12px;"><div class="label">Total no período</div><div class="value">'+fmtMoney(total)+'</div></div>'+
    (linhasCategoria.length===0?'':
    '<h4 style="margin-bottom:6px;">Resumo por categoria (itens iguais já somados)</h4>'+
    '<div class="table-wrap" style="margin-bottom:20px;"><table><thead><tr><th>Categoria</th><th>Quantidade</th><th>Valor total</th></tr></thead><tbody>'+
    linhasCategoria.map(l=>'<tr><td>'+l[0]+'</td><td>'+l[1].qtd+'</td><td>'+fmtMoney(l[1].valor)+'</td></tr>').join('')+
    '</tbody></table></div>')+
    (filtradas.length===0?'<div class="empty">Nenhuma venda encontrada.</div>':
    '<h4 style="margin-bottom:6px;">Lançamentos individuais</h4>'+
    '<div class="table-wrap"><table><thead><tr><th>Data</th><th>Produto</th><th>Cliente</th><th>Canal</th><th>Valor</th><th>Pagto</th></tr></thead><tbody>'+
    filtradas.slice().sort((a,b)=> a.categoria.localeCompare(b.categoria) || b.data.localeCompare(a.data)).map(v=>'<tr><td>'+fmtDate(v.data)+'</td><td>'+v.categoria+'</td><td>'+(v.cliente||'—')+'</td><td>'+(v.canal||'—')+'</td><td>'+fmtMoney(v.valor_total)+'</td><td>'+v.pagamento+'</td></tr>').join('')+
    '</tbody></table></div>');
}

function corNota(tipo){
  const cores = {
    'Nota fiscal': '#FEE2E2',
    'Cupom não fiscal': '#FEF3C7',
    'Já lançado': '#DCFCE7',
    'Não lança': '#F1F5F9'
  };
  return cores[tipo] || '';
}

function renderRelatorioEmpresasResultado(){
  const de = document.getElementById('re-de').value, ate = document.getElementById('re-ate').value;
  const filtradas = state.vendas.filter(v=> v.data>=de && v.data<=ate && v.empresa);
  const porEmpresa = {};
  filtradas.forEach(v=>{ porEmpresa[v.empresa] = (porEmpresa[v.empresa]||0) + v.valor_total; });
  const linhas = Object.entries(porEmpresa).sort((a,b)=>b[1]-a[1]);
  document.getElementById('re-resultado').innerHTML = linhas.length===0 ? '<div class="empty">Nenhuma venda com empresa conveniada nesse período.</div>' :
    '<div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Total no período</th></tr></thead><tbody>'+
    linhas.map(l=>'<tr><td>'+l[0]+'</td><td>'+fmtMoney(l[1])+'</td></tr>').join('')+'</tbody></table></div>';
}

/* ---------- HANDLERS ---------- */
function attachHandlers(){
  const selCat = document.getElementById('sel-categoria');
  if(selCat){
    const selProdutoCatalogo = document.getElementById('sel-produto-catalogo');
    const produtoLivreMain = document.querySelector('input[name="produto_livre"]');
    const valorUnitMain = document.querySelector('input[name="valor_unit"]');
    const manualWrap = document.getElementById('wrap-produto-manual');
    const handleProdutoCatalogoChange = ()=>{
      if(!selProdutoCatalogo) return;
      if(selProdutoCatalogo.value==='__outro__'){
        if(manualWrap) manualWrap.style.display = 'block';
        if(produtoLivreMain){ produtoLivreMain.value=''; produtoLivreMain.focus(); }
      } else {
        if(manualWrap) manualWrap.style.display = 'none';
        if(produtoLivreMain) produtoLivreMain.value = selProdutoCatalogo.value;
        const opt = selProdutoCatalogo.selectedOptions[0];
        if(opt && opt.dataset.preco && valorUnitMain) valorUnitMain.value = Number(opt.dataset.preco).toFixed(2);
      }
    };
    if(selProdutoCatalogo) selProdutoCatalogo.onchange = handleProdutoCatalogoChange;
    const toggle = ()=>{
      document.getElementById('wrap-produto').style.display = 'block';
      const unico = popularSelectProdutoCatalogo('sel-produto-catalogo', selCat.value);
      if(manualWrap) manualWrap.style.display = 'none';
      if(unico) handleProdutoCatalogoChange();
    };
    selCat.onchange = toggle;
    toggle();
  }
  const fvPre = document.getElementById('form-venda');
  if(fvPre && prefillVenda){
    if(prefillVenda.cliente) fvPre.cliente.value = prefillVenda.cliente;
    if(prefillVenda.categoria) fvPre.categoria.value = prefillVenda.categoria;
    if(prefillVenda.produto_livre) fvPre.produto_livre.value = prefillVenda.produto_livre;
    if(prefillVenda.quantidade) fvPre.quantidade.value = prefillVenda.quantidade;
    if(prefillVenda.tipo_entrega) fvPre.tipo_entrega.value = prefillVenda.tipo_entrega;
    if(prefillVenda.empresa) fvPre.empresa.value = prefillVenda.empresa;
    if(prefillVenda.entrega_data) fvPre.entrega_data.value = prefillVenda.entrega_data;
    if(prefillVenda.entrega_hora) fvPre.entrega_hora.value = prefillVenda.entrega_hora;
    if(prefillVenda.obs) fvPre.obs.value = prefillVenda.obs;
    if(prefillVenda.pagamento) fvPre.pagamento.value = prefillVenda.pagamento;
    if(prefillVenda.frete) fvPre.frete.value = prefillVenda.frete;
    prefillVenda = null;
    const wrapProdutoEl = document.getElementById('wrap-produto');
    if(wrapProdutoEl) wrapProdutoEl.style.display = 'block';
    popularSelectProdutoCatalogo('sel-produto-catalogo', fvPre.categoria.value);
    const selProdCatPre = document.getElementById('sel-produto-catalogo');
    const manualWrapPre = document.getElementById('wrap-produto-manual');
    if(selProdCatPre && fvPre.produto_livre.value){
      const nomeProduto = fvPre.produto_livre.value;
      const existe = Array.from(selProdCatPre.options).some(o=>o.value===nomeProduto);
      if(existe){ selProdCatPre.value = nomeProduto; if(manualWrapPre) manualWrapPre.style.display='none'; }
      else { selProdCatPre.value = '__outro__'; if(manualWrapPre) manualWrapPre.style.display='block'; }
    }
  }
  const btnNovaCatProduto = document.getElementById('btn-nova-cat-produto');
  if(btnNovaCatProduto) btnNovaCatProduto.onclick = ()=>{ document.getElementById('nova-cat-produto-wrap').style.display='block'; };
  const btnAddCatProduto = document.getElementById('btn-add-cat-produto');
  if(btnAddCatProduto) btnAddCatProduto.onclick = async ()=>{
    const val = document.getElementById('nova-cat-produto-input').value.trim();
    if(!val) return;
    if(!state.categoriasProdutos.includes(val)) state.categoriasProdutos.push(val);
    await save('categoriasProdutos');
    renderAll();
  };
  const btnNovaCatDespesa = document.getElementById('btn-nova-cat-despesa');
  if(btnNovaCatDespesa) btnNovaCatDespesa.onclick = ()=>{ document.getElementById('nova-cat-despesa-wrap').style.display='block'; };
  const btnAddCatDespesa = document.getElementById('btn-add-cat-despesa');
  if(btnAddCatDespesa) btnAddCatDespesa.onclick = async ()=>{
    const val = document.getElementById('nova-cat-despesa-input').value.trim();
    if(!val) return;
    if(!state.categoriasDespesas.includes(val)) state.categoriasDespesas.push(val);
    await save('categoriasDespesas');
    renderAll();
  };

  /* ---- Gerenciar categorias (Configurações) ---- */
  const btnAddCatProdutoConfig = document.getElementById('btn-add-cat-produto-config');
  if(btnAddCatProdutoConfig) btnAddCatProdutoConfig.onclick = async ()=>{
    const inp = document.getElementById('nova-cat-produto-config-input');
    const val = inp.value.trim();
    if(!val) return;
    if(state.categoriasProdutos.includes(val)){ alert('Já existe uma categoria de produto com esse nome.'); return; }
    if(categoriaControladaEquivalente(val)){ alert('Isso parece um item de gás ou água, que já é controlado automaticamente pelo estoque — não crie uma categoria separada pra ele. Se o preço estiver errado, edite direto na seção "Gás e água" da aba Produtos.'); return; }
    state.categoriasProdutos.push(val);
    await save('categoriasProdutos');
    renderAll();
  };
  document.querySelectorAll('[data-edit-cat-produto]').forEach(btn=>btn.onclick=()=>{
    editCategoriaProdutoNome = btn.dataset.editCatProduto;
    renderAll();
  });
  document.querySelectorAll('[data-cancel-cat-produto]').forEach(btn=>btn.onclick=()=>{
    editCategoriaProdutoNome = null;
    renderAll();
  });
  document.querySelectorAll('[data-save-cat-produto]').forEach(btn=>btn.onclick=async()=>{
    const oldName = btn.dataset.saveCatProduto;
    const inp = document.getElementById('input-edit-cat-produto');
    const newName = inp ? inp.value.trim() : '';
    if(!newName) return;
    if(newName!==oldName && state.categoriasProdutos.includes(newName)){ alert('Já existe uma categoria com esse nome.'); return; }
    if(newName!==oldName){
      renomearCategoriaProduto(oldName, newName);
      await save('categoriasProdutos'); await save('produtos'); await save('vendas'); await save('agendamentos');
    }
    editCategoriaProdutoNome = null;
    renderAll();
  });
  document.querySelectorAll('[data-del-cat-produto]').forEach(btn=>btn.onclick=async()=>{
    const cat = btn.dataset.delCatProduto;
    const qtd = produtosDaCategoria(cat).length;
    const msg = qtd>0
      ? 'Essa categoria tem '+qtd+' produto(s) cadastrados. Excluir a categoria também vai excluir esses produtos do catálogo (vendas já registradas não serão afetadas). Deseja continuar?'
      : 'Excluir a categoria "'+cat+'"?';
    if(!confirm(msg)) return;
    state.categoriasProdutos = state.categoriasProdutos.filter(c=>c!==cat);
    state.produtos = state.produtos.filter(p=>p.categoria!==cat);
    await save('categoriasProdutos'); await save('produtos');
    renderAll();
  });

  const btnAddCatDespesaConfig = document.getElementById('btn-add-cat-despesa-config');
  if(btnAddCatDespesaConfig) btnAddCatDespesaConfig.onclick = async ()=>{
    const inp = document.getElementById('nova-cat-despesa-config-input');
    const val = inp.value.trim();
    if(!val) return;
    if(state.categoriasDespesas.includes(val)){ alert('Já existe uma categoria de despesa com esse nome.'); return; }
    state.categoriasDespesas.push(val);
    await save('categoriasDespesas');
    renderAll();
  };
  document.querySelectorAll('[data-edit-cat-despesa]').forEach(btn=>btn.onclick=()=>{
    editCategoriaDespesaNome = btn.dataset.editCatDespesa;
    renderAll();
  });
  document.querySelectorAll('[data-cancel-cat-despesa]').forEach(btn=>btn.onclick=()=>{
    editCategoriaDespesaNome = null;
    renderAll();
  });
  document.querySelectorAll('[data-save-cat-despesa]').forEach(btn=>btn.onclick=async()=>{
    const oldName = btn.dataset.saveCatDespesa;
    const inp = document.getElementById('input-edit-cat-despesa');
    const newName = inp ? inp.value.trim() : '';
    if(!newName) return;
    if(newName!==oldName && state.categoriasDespesas.includes(newName)){ alert('Já existe uma categoria com esse nome.'); return; }
    if(newName!==oldName){
      renomearCategoriaDespesa(oldName, newName);
      await save('categoriasDespesas'); await save('despesas');
    }
    editCategoriaDespesaNome = null;
    renderAll();
  });
  document.querySelectorAll('[data-del-cat-despesa]').forEach(btn=>btn.onclick=async()=>{
    const cat = btn.dataset.delCatDespesa;
    const qtd = despesasDaCategoria(cat).length;
    const msg = qtd>0
      ? 'Essa categoria tem '+qtd+' despesa(s) registradas. Elas vão manter o nome antigo no histórico, mas a categoria não vai aparecer mais para novos lançamentos. Deseja continuar?'
      : 'Excluir a categoria "'+cat+'"?';
    if(!confirm(msg)) return;
    state.categoriasDespesas = state.categoriasDespesas.filter(c=>c!==cat);
    await save('categoriasDespesas');
    renderAll();
  });

  const btnUnificarDuplicados = document.getElementById('btn-unificar-duplicados');
  if(btnUnificarDuplicados) btnUnificarDuplicados.onclick = async ()=>{
    if(!confirm('Isso vai juntar categorias e produtos com nomes repetidos (ignorando maiúsculas, acentos e espaços). Não pode ser desfeito. Continuar?')) return;
    const catsProdUnificadas = mesclarCategoriasDuplicadas();
    const catsDespUnificadas = mesclarCategoriasDespesasDuplicadas();
    const produtosUnificados = mesclarProdutosDuplicados();
    await save('categoriasProdutos'); await save('produtos'); await save('vendas'); await save('agendamentos');
    await save('categoriasDespesas'); await save('despesas');
    alert('Pronto! '+catsProdUnificadas+' categoria(s) de produto, '+catsDespUnificadas+' categoria(s) de despesa e '+produtosUnificados+' produto(s) duplicados foram unificados.');
    renderAll();
  };
  const btnExcluirCatDuplicadasEstoque = document.getElementById('btn-excluir-cat-duplicadas-estoque');
  if(btnExcluirCatDuplicadasEstoque) btnExcluirCatDuplicadasEstoque.onclick = async ()=>{
    const selecionadas = Array.from(document.querySelectorAll('.chk-cat-duplicada:checked')).map(el=>el.value);
    if(selecionadas.length===0){ alert('Selecione ao menos uma categoria.'); return; }
    const totalProdutos = selecionadas.reduce((s,c)=>s+produtosDaCategoria(c).length,0);
    if(!confirm('Isso vai excluir '+selecionadas.length+' categoria(s) e '+totalProdutos+' produto(s) do catálogo, mantendo só o controle de estoque nativo de gás/água. Vendas já registradas não são afetadas. Confirma?')) return;
    state.categoriasProdutos = state.categoriasProdutos.filter(c=>!selecionadas.includes(c));
    state.produtos = state.produtos.filter(p=>!selecionadas.includes(p.categoria));
    await save('categoriasProdutos'); await save('produtos');
    alert('Categorias e produtos removidos. O estoque de gás e água continua controlado normalmente pela aba Estoque.');
    renderAll();
  };
  const btnExcluirTodosProdutos = document.getElementById('btn-excluir-todos-produtos');
  if(btnExcluirTodosProdutos) btnExcluirTodosProdutos.onclick = async ()=>{
    const qtd = state.produtos.filter(p=>!CATEGORIAS_CONTROLADAS.includes(p.categoria)).length;
    if(qtd===0){ alert('Não há produtos pra excluir — o catálogo já só tem gás e água.'); return; }
    if(!confirm('Isso vai excluir '+qtd+' produto(s) do catálogo, mantendo gás e água intactos. As categorias continuam cadastradas. Continuar?')) return;
    if(!confirm('Tem certeza mesmo? Essa ação não pode ser desfeita.')) return;
    state.produtos = state.produtos.filter(p=>CATEGORIAS_CONTROLADAS.includes(p.categoria));
    await save('produtos');
    alert('Produtos excluídos. As categorias e o controle de estoque de gás/água continuam intactos.');
    renderAll();
  };

  const fv = document.getElementById('form-venda');
  if(fv) fv.onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(fv);
    const categoria = f.get('categoria');
    const controlada = isControlada(categoria);
    const produto = controlada ? categoria : (f.get('produto_livre')||'(sem nome)');
    const quantidade = Number(f.get('quantidade'));
    const valor_unit = Number(f.get('valor_unit'));

function detectDelimiter(line){
  const candidates = ['\t', ';', ','];
  let best = candidates[0], bestCount = -1;
  candidates.forEach(d=>{
    const c = line.split(d).length;
    if(c>bestCount){ bestCount=c; best=d; }
  });
  return best;
}
function parseDelimitedLine(line, delim){
  const cells = []; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch==='"'){
      if(inQuotes && line[i+1]==='"'){ cur+='"'; i++; }
      else inQuotes = !inQuotes;
    } else if(ch===delim && !inQuotes){
      cells.push(cur.trim()); cur='';
    } else { cur+=ch; }
  }
  cells.push(cur.trim());
  return cells.map(c=>c.replace(/^"|"$/g,''));
}
function guessHeader(headers, keywords){
  const h = headers.find(h=>keywords.some(k=>h.toLowerCase().includes(k)));
  return h || headers[0];
}
function linhasParaObjetos(headers, linhas){
  return linhas.map(function(cells){
    const obj = {};
    headers.forEach((h,i)=>obj[h]=(cells[i]!=null?String(cells[i]):''));
    return obj;
  });
}
function lerArquivoPlanilha(file, onResult, containerId){
  if(typeof XLSX==='undefined' && /\.(xlsx|xls)$/i.test(file.name)){
    alert('Não consegui carregar o leitor de Excel (biblioteca não carregou). Confira sua conexão com a internet e tente de novo — ou exporte a planilha como CSV e importe o CSV.');
    return;
  }
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx' || ext==='xls'){
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:true});
        const nomes = wb.SheetNames;
        const usarSheet = function(nome){
          const ws = wb.Sheets[nome];
          const matriz = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, dateNF:'yyyy-mm-dd', blankrows:false});
          if(!matriz || matriz.length<2){ alert('Essa aba da planilha parece vazia.'); return; }
          const headers = matriz[0].map(h=>String(h||'').trim());
          const linhas = matriz.slice(1).filter(l=>l.some(c=>c!=null && String(c).trim()!==''));
          onResult(headers, linhasParaObjetos(headers, linhas));
        };
        if(nomes.length===1){ usarSheet(nomes[0]); return; }
        const container = containerId ? document.getElementById(containerId) : null;
        if(!container){ usarSheet(nomes[0]); return; }
        container.innerHTML = '<div class="hint" style="margin-top:10px;">Essa planilha tem '+nomes.length+' aba(s). Escolha qual usar:</div>'+
          '<select id="sel-escolher-aba">'+nomes.map(n=>'<option value="'+n+'">'+n+'</option>').join('')+'</select> '+
          '<button type="button" class="btn small ghost" id="btn-confirmar-aba">Usar essa aba</button>';
        document.getElementById('btn-confirmar-aba').onclick = ()=>{
          const escolhida = document.getElementById('sel-escolher-aba').value;
          container.innerHTML = '';
          usarSheet(escolhida);
        };
      }catch(e){
        console.error(e);
        alert('Não consegui ler esse arquivo Excel. Detalhe: '+(e && e.message ? e.message : e)+'\n\nSe continuar falhando, exporte a planilha como CSV (Arquivo > Fazer download > CSV) e importe o CSV.');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const text = ev.target.result;
      const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
      if(lines.length<2){ alert('O arquivo parece vazio.'); return; }
      const delim = detectDelimiter(lines[0]);
      const headers = parseDelimitedLine(lines[0], delim);
      const linhas = lines.slice(1).map(l=>parseDelimitedLine(l, delim));
      onResult(headers, linhasParaObjetos(headers, linhas));
    };
    reader.readAsText(file, 'UTF-8');
  }
}
function guessHeaderPriority(headers, groups){
  for(const kws of groups){
    const h = headers.find(h=>kws.some(k=>h.toLowerCase().includes(k)));
    if(h) return h;
  }
  return '';
}
function normalizarDataImportada(txt, fallback){
  const s = (txt||'').trim();
  if(!s) return fallback;
  const isoMatch = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(isoMatch) return isoMatch[1]+'-'+isoMatch[2]+'-'+isoMatch[3];
  const brMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(brMatch){
    const dd = brMatch[1].padStart(2,'0');
    const mm = brMatch[2].padStart(2,'0');
    let yyyy = brMatch[3];
    if(yyyy.length===2) yyyy = '20'+yyyy;
    return yyyy+'-'+mm+'-'+dd;
  }
  return fallback;
}
function categoriaControladaEquivalente(texto){
  const chave = chaveNormalizada(texto||'');
  if(!chave) return false;
  const encontrada = CATEGORIAS_CONTROLADAS.find(c=>chaveNormalizada(c)===chave);
  if(encontrada) return true;
  if(/(^|\s)g[aá]s(\s|$)|glp|botij[aã]o|carga de g[aá]s|vasilhame de g[aá]s|gas do povo/.test(chave)) return true;
  if(/safira|d ?fonte|dfonte/.test(chave)) return true;
  if(/agua/.test(chave) && /20/.test(chave)) return true;
  return false;
}

  document.getElementById('map-prod-nome').value = guessHeaderPriority(csvProdHeaders,[['descrição','descricao','nome','produto']]);
  document.getElementById('map-prod-preco').value = guessHeaderPriority(csvProdHeaders,[['preço','preco','valor']]);
  document.getElementById('map-prod-categoria').value = guessHeaderPriority(csvProdHeaders,[['categoria']]);
  document.getElementById('map-prod-situacao').value = guessHeaderPriority(csvProdHeaders,[['situação','situacao']]);
  document.getElementById('btn-importar-csv-prod').onclick = async()=>{
    const colNome = document.getElementById('map-prod-nome').value;
    const colPreco = document.getElementById('map-prod-preco').value;
    const colCategoria = document.getElementById('map-prod-categoria').value;
    const colSituacao = document.getElementById('map-prod-situacao').value;
    const somenteAtivos = document.getElementById('chk-somente-ativos').checked;
    const existentes = new Set(state.produtos.map(p=>(p.categoria+'|'+p.nome).toLowerCase()));
    const vistos = new Set();
    const novos = [];
    const categoriasNovas = new Set();
    let duplicados = 0, ignoradosInativos = 0, ignoradosControlados = 0;
    csvProdRows.filter(r=>r[colNome]).forEach(r=>{
      if(somenteAtivos && colSituacao && r[colSituacao] && r[colSituacao].trim().toLowerCase()!=='ativo'){ ignoradosInativos++; return; }
      const nome = r[colNome].trim();
      let categoria = colCategoria ? (r[colCategoria]||'').trim() : '';
      if(!categoria) categoria = 'Mercearia';
      if(categoriaControladaEquivalente(categoria) || categoriaControladaEquivalente(nome)){ ignoradosControlados++; return; }
      const precoTxt = colPreco ? (r[colPreco]||'0') : '0';
      const preco = Number(precoTxt.replace(/\./g,'').replace(',','.')) || 0;
      const chave = (categoria+'|'+nome).toLowerCase();
      if(existentes.has(chave) || vistos.has(chave)){ duplicados++; return; }
      vistos.add(chave);
      if(!state.categoriasProdutos.includes(categoria)) categoriasNovas.add(categoria);
      novos.push({id:uid(), nome, categoria, preco, ativo:true});
    });
    categoriasNovas.forEach(c=>state.categoriasProdutos.push(c));
    state.produtos = state.produtos.concat(novos);
    await save('produtos');
    if(categoriasNovas.size>0) await save('categoriasProdutos');
    csvProdRows=null; csvProdHeaders=null;
    renderAll();
    alert(novos.length+' produtos importados com sucesso.'+
      (duplicados>0 ? ' '+duplicados+' já existiam e foram ignorados.' : '')+
      (ignoradosInativos>0 ? ' '+ignoradosInativos+' estavam inativos e não foram importados.' : '')+
      (ignoradosControlados>0 ? ' '+ignoradosControlados+' eram itens de gás/água (já controlados pelo estoque) e foram ignorados de propósito, pra não duplicar.' : ''));
  };
}

    '<div class="mapping-row"><span>Nome do cliente</span><select id="map-fiado-nome">'+opts+'</select></div>'+
    '<div class="mapping-row"><span>Valor</span><select id="map-fiado-valor">'+opts+'</select></div>'+
    '<div class="mapping-row"><span>Data</span><select id="map-fiado-data">'+optsVazio+'</select></div>'+
    '<div class="mapping-row"><span>Descrição</span><select id="map-fiado-descricao">'+optsVazio+'</select></div>'+
    '<div class="mapping-row"><span>Tipo (se o arquivo tiver fiado e crédito misturados)</span><select id="map-fiado-tipo">'+optsVazio+'</select></div>'+
    '<div class="mapping-row"><span>Situação (PAGO / NÃO PAGO)</span><select id="map-fiado-situacao">'+optsVazio+'</select></div>'+
    '<label class="checkbox-item" style="margin-top:6px;"><input type="checkbox" id="chk-fiado-so-nao-pago" checked> Importar só as linhas marcadas como NÃO PAGO (pula as já quitadas)</label>'+
    '<div id="wrap-fiado-data-base" style="margin-top:10px;max-width:260px;"><label>Data a usar (o arquivo não tem coluna de data)</label><input type="date" id="input-fiado-data-base" value="'+todayStr()+'"></div>'+
    '<div class="csv-preview"><table><thead><tr>'+csvFiadoHeaders.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead>'+
    '<tbody>'+csvFiadoRows.slice(0,3).map(r=>'<tr>'+csvFiadoHeaders.map(h=>'<td>'+r[h]+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+
    '<button class="btn green" id="btn-importar-csv-fiado">Importar '+csvFiadoRows.length+' lançamento(s)</button>';
  document.getElementById('map-fiado-nome').value = guessHeaderPriority(csvFiadoHeaders,[['nome','cliente']]);
  document.getElementById('map-fiado-valor').value = guessHeaderPriority(csvFiadoHeaders,[['valor','saldo','débito','debito']]);
  document.getElementById('map-fiado-data').value = guessHeaderPriority(csvFiadoHeaders,[['data']]);
  document.getElementById('map-fiado-descricao').value = guessHeaderPriority(csvFiadoHeaders,[['descrição','descricao','observação','observacao','obs']]);
  document.getElementById('map-fiado-tipo').value = guessHeaderPriority(csvFiadoHeaders,[['tipo']]);
  document.getElementById('map-fiado-situacao').value = guessHeaderPriority(csvFiadoHeaders,[['status','situação','situacao']]);
  const colDataEl = document.getElementById('map-fiado-data');
  const wrapDataBase = document.getElementById('wrap-fiado-data-base');
  const atualizarWrapDataBase = ()=>{ wrapDataBase.style.display = colDataEl.value ? 'none' : 'block'; };
  colDataEl.onchange = atualizarWrapDataBase;
  atualizarWrapDataBase();
  document.getElementById('btn-importar-csv-fiado').onclick = async()=>{
    const colNome = document.getElementById('map-fiado-nome').value;
    const colValor = document.getElementById('map-fiado-valor').value;
    const colData = document.getElementById('map-fiado-data').value;
    const colDescricao = document.getElementById('map-fiado-descricao').value;
    const colTipo = document.getElementById('map-fiado-tipo').value;
    const colSituacao = document.getElementById('map-fiado-situacao').value;
    const soNaoPago = document.getElementById('chk-fiado-so-nao-pago').checked;
    const tipoPadrao = document.getElementById('sel-tipo-import-fiado').value;
    const dataBaseEl = document.getElementById('input-fiado-data-base');
    const dataBase = dataBaseEl ? dataBaseEl.value : todayStr();
    if(!colNome || !colValor){ alert('Selecione ao menos as colunas de nome e valor.'); return; }
    let importadosFiado = 0, importadosCredito = 0, ignorados = 0, puladosPagos = 0;
    csvFiadoRows.forEach(r=>{
      if(colSituacao && soNaoPago){
        const sit = (r[colSituacao]||'').trim().toLowerCase();
        if(sit.indexOf('não')>-1 && sit.indexOf('pago')>-1){ /* não pago: segue */ }
        else if(sit==='pago'){ puladosPagos++; return; }
      }
      const nome = (r[colNome]||'').trim();
      const valorTxt = (colValor ? r[colValor] : '')||'0';
      const valor = Math.abs(Number(String(valorTxt).replace(/\./g,'').replace(',','.'))) || 0;
      if(!nome || valor<=0){ ignorados++; return; }
      const data = colData ? normalizarDataImportada(r[colData], dataBase) : dataBase;
      const descricao = colDescricao ? (r[colDescricao]||'').trim() : '';
      let tipo = tipoPadrao;
      if(colTipo && r[colTipo]){
        const t = r[colTipo].trim().toLowerCase();
        if(t.indexOf('cred')>-1 || t.indexOf('haver')>-1 || t.indexOf('abat')>-1) tipo = 'credito';
        else if(t.indexOf('fiad')>-1 || t.indexOf('deve')>-1) tipo = 'fiado';
      }
      if(tipo==='credito'){
        state.creditos.push({id:uid(), cliente:nome, valor:valor, data:data, obs: descricao || 'Importado — saldo anterior ao sistema'});
        importadosCredito++;
      } else {
        state.fiados.push({id:uid(), cliente:nome, valor:valor, data:data, descricao: descricao || 'Importado — saldo anterior ao sistema'});
        importadosFiado++;
      }
    });
    if(importadosFiado>0) await save('fiados');
    if(importadosCredito>0) await save('creditos');
    csvFiadoRows=null; csvFiadoHeaders=null;
    renderAll();
    alert((importadosFiado+importadosCredito)+' lançamento(s) importado(s) — '+importadosFiado+' de fiado e '+importadosCredito+' de crédito.'+(ignorados>0?' '+ignorados+' linha(s) ignoradas por falta de nome ou valor.':'')+(puladosPagos>0?' '+puladosPagos+' linha(s) já pagas foram puladas.':''));
  };
}

    const colEnd = document.getElementById('map-endereco').value;

      const nomeChave = (r[colNome]||'').trim().toLowerCase();

/* ---------- AUTENTICAÇÃO ---------- */
function showAuthMsg(text, ok){
  document.getElementById('auth-msg-wrap').innerHTML =
    '<div class="auth-msg '+(ok?'ok':'err')+'">'+text+'</div>';
}
function switchAuthTab(tab){
  document.querySelectorAll('[data-authtab]').forEach(b=>b.classList.toggle('active', b.dataset.authtab===tab));
  document.querySelectorAll('.auth-form').forEach(f=>f.classList.remove('active'));
  document.getElementById('form-'+tab).classList.add('active');
  document.getElementById('auth-msg-wrap').innerHTML = '';
}
const AUTH_DOMINIO_INTERNO = 'apptomgas.internal';
function normalizarUsuario(u){
  return (u||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9._-]/g,'');
}
function normalizarTelefoneAuth(t){
  return (t||'').replace(/\D/g,'');
}
function construirEmailAuth(tipo, valor){
  if(tipo==='telefone') return normalizarTelefoneAuth(valor)+'@'+AUTH_DOMINIO_INTERNO;
  if(tipo==='usuario') return normalizarUsuario(valor)+'@'+AUTH_DOMINIO_INTERNO;
  return (valor||'').trim().toLowerCase();
}
function detectarLoginEmail(identificador){
  const v = (identificador||'').trim();
  if(v.includes('@')) return v.toLowerCase();
  const soDigitos = v.replace(/\D/g,'');
  const naoDigitos = v.replace(/[0-9\s()+-]/g,'');
  if(soDigitos.length>=10 && soDigitos.length<=13 && naoDigitos.length===0){
    return normalizarTelefoneAuth(v)+'@'+AUTH_DOMINIO_INTERNO;
  }
  return normalizarUsuario(v)+'@'+AUTH_DOMINIO_INTERNO;
}
function attachAuthHandlers(){
  document.querySelectorAll('[data-authtab]').forEach(b=>b.onclick=()=>switchAuthTab(b.dataset.authtab));

  const cadastroTipo = document.getElementById('cadastro-tipo');
  if(cadastroTipo) cadastroTipo.onchange = ()=>{
    document.getElementById('cadastro-campo-email').style.display = cadastroTipo.value==='email' ? 'block' : 'none';
    document.getElementById('cadastro-campo-telefone').style.display = cadastroTipo.value==='telefone' ? 'block' : 'none';
    document.getElementById('cadastro-campo-usuario').style.display = cadastroTipo.value==='usuario' ? 'block' : 'none';
  };

  document.getElementById('form-login').onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const loginEmail = detectarLoginEmail(f.get('identificador'));
    const { error } = await supabaseClient.auth.signInWithPassword({ email:loginEmail, password:f.get('senha') });
    if(error){ showAuthMsg(error.message==='Invalid login credentials' ? 'E-mail/celular/usuário ou senha incorretos.' : error.message, false); return; }
    await afterLogin();
  };

  document.getElementById('form-cadastro').onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    if(f.get('senha') !== f.get('senha2')){ showAuthMsg('As senhas não conferem.', false); return; }
    const tipo = document.getElementById('cadastro-tipo').value;
    const valorCampo = tipo==='email' ? document.getElementById('cadastro-email').value :
      tipo==='telefone' ? document.getElementById('cadastro-telefone').value :
      document.getElementById('cadastro-usuario').value;
    if(!valorCampo || !valorCampo.trim()){
      showAuthMsg(tipo==='email' ? 'Informe o e-mail.' : tipo==='telefone' ? 'Informe o celular.' : 'Informe o usuário.', false);
      return;
    }
    const loginEmail = construirEmailAuth(tipo, valorCampo);
    const { error } = await supabaseClient.auth.signUp({
      email:loginEmail, password:f.get('senha'),
      options: { data: {
        nome: f.get('nome'),
        tipo_login: tipo,
        email_real: tipo==='email' ? valorCampo.trim() : '',
        telefone: tipo==='telefone' ? normalizarTelefoneAuth(valorCampo) : '',
        usuario: tipo==='usuario' ? normalizarUsuario(valorCampo) : ''
      } }
    });
    if(error){ showAuthMsg(error.message, false); return; }
    if(tipo==='email'){
      showAuthMsg('Conta criada! Verifique seu e-mail para confirmar antes de entrar.', true);
    } else {
      showAuthMsg('Conta criada! Já pode entrar usando o '+(tipo==='telefone'?'celular':'usuário')+' e a senha cadastrados.', true);
    }
    switchAuthTab('login');
  };

  document.getElementById('form-recuperar').onsubmit = async(e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await supabaseClient.auth.resetPasswordForEmail(f.get('email'), { redirectTo: window.location.href });
    if(error){ showAuthMsg(error.message, false); return; }
    showAuthMsg('Enviamos um link de recuperação para o seu e-mail.', true);
  };
}


function atualizarSinoBadge(){

  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('main').innerHTML = '<div class="empty">Carregando...</div>';
  try{

    if(user){
      const meta = user.user_metadata || {};
      usuarioAtualNome = meta.nome || meta.email_real || meta.usuario || meta.telefone || (user.email||'').split('@')[0] || 'Usuário';
    }
  }catch(e){ console.error('Erro ao buscar usuário logado', e); }
  await loadAll();
  renderHeaderLogo();
  aplicarFavicon();
  renderAll();
  rodarBackupAutomaticoSeNecessario();
  iniciarNotificacoesRealtime();
  atualizarBadgeApp();
  atualizarSinoBadge();
  if(statusPermissaoNotificacao()==='granted') inscreverPush();

  if(btnLogout) btnLogout.onclick = async ()=>{
    await supabaseClient.auth.signOut();

    document.getElementById('auth-screen').style.display = 'flex';
    switchAuthTab('login');
  };
  const btnSinoComunicados = document.getElementById('btn-sino-comunicados');
  if(btnSinoComunicados) btnSinoComunicados.onclick = ()=>{
    if(currentTab!=='comunicados'){ telaAnteriorComunicados = currentTab; currentTab='comunicados'; }
    else { currentTab = telaAnteriorComunicados; }
    editComunicadoId = null;
    renderAll();
  };
  atualizarSinoBadge();
}

/* ---------- PWA / NOTIFICAÇÕES ---------- */
function registerServiceWorker(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Erro ao registrar service worker', e));
  }
}
function statusPermissaoNotificacao(){
  if(!('Notification' in window)) return 'indisponivel';
  return Notification.permission;
}
async function pedirPermissaoNotificacao(){
  if(!('Notification' in window)){ alert('Este navegador não suporta notificações.'); return; }
  const perm = await Notification.requestPermission();
  renderAll();
  if(perm==='granted'){
    notificarLocal('Notificações ativadas', 'Você vai receber avisos de novos agendamentos e entregas por aqui.');
    await inscreverPush();
  }
}
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
async function inscreverPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await supabaseClient.from('push_subscriptions').upsert({
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: 'endpoint' });
  }catch(e){ console.error('Erro ao se inscrever para notificações push', e); }
}
async function enviarPushServidor(titulo, corpo){
  try{
    await fetch(SUPABASE_URL + '/functions/v1/swift-handler', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ title: titulo, body: corpo })
    });
  }catch(e){ console.error('Erro ao enviar notificação push', e); }
}
function atualizarBadgeApp(){
  if(!('setAppBadge' in navigator)) return;
  const pendentesAg = state.agendamentos.filter(a=>a.status==='pendente').length;
  const pendentesVenda = state.vendas.filter(v=>v.entrega_hora && v.entrega_status!=='entregue').length;
  const pendentes = pendentesAg + pendentesVenda;
  try{
    if(pendentes>0) navigator.setAppBadge(pendentes).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }catch(e){}
}
function notificarLocal(titulo, corpo){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const options = { body: corpo, icon: 'icon-192-v2.png', badge: 'icon-192-v2.png', vibrate:[200,100,200] };
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration().then(reg=>{
      if(reg && reg.showNotification){ reg.showNotification(titulo, options); }
      else { new Notification(titulo, options); }
    }).catch(()=>{ try{ new Notification(titulo, options); }catch(e){ console.error('Notificação falhou', e); } });
  } else {
    try{ new Notification(titulo, options); }catch(e){ console.error('Notificação falhou', e); }
  }
}
function iniciarNotificacoesRealtime(){
  try{
    supabaseClient.channel('app_data_mudancas')
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_data', filter:'chave=eq.agendamentos' }, (payload)=>{
        const novoValor = payload.new && payload.new.valor ? payload.new.valor : [];
        const idsAntigos = new Set(state.agendamentos.map(a=>a.id));
        const novos = novoValor.filter(a=>!idsAntigos.has(a.id));
        novos.forEach(a=>{
          notificarLocal('Novo agendamento de entrega', (a.cliente||'Cliente')+' — '+(a.hora||'')+(a.data?' ('+fmtDate(a.data)+')':''));
        });
        state.agendamentos = novoValor;
        atualizarBadgeApp();
        if(currentTab==='agendamentos' || currentTab==='dashboard') renderAll();
      })
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'app_data', filter:'chave=eq.vendas' }, (payload)=>{
        const novoValor = payload.new && payload.new.valor ? payload.new.valor : [];
        const idsAntigos = new Set(state.vendas.map(v=>v.id));
        const novos = novoValor.filter(v=>!idsAntigos.has(v.id) && v.entrega_hora);
        novos.forEach(v=>{
          notificarLocal('Nova entrega registrada', (v.cliente||'Cliente')+' — '+v.produto+' às '+v.entrega_hora);
        });
        state.vendas = novoValor;
        if(currentTab==='vendas' || currentTab==='dashboard') renderAll();
      })
      .subscribe();
  }catch(e){ console.error('Erro ao iniciar notificações em tempo real', e); }
}

  attachAuthHandlers();
  attachLogoInput();
  registerServiceWorker();
  const { data:{ session } } = await supabaseClient.auth.getSession();
  if(session){
    await afterLogin();
  } else {
    document.getElementById('auth-screen').style.display = 'flex';
  }
}
init();
